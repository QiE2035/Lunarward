name: Linux

# 只验证 Lunarward 能编译、纯逻辑单测能过。
# 不跑游戏、不下载游戏资源、不产出发行物（发布链路见 D38：推迟）。
#
# 仓库根的 Starward.slnx 只含 Linux 项目（D53），且有 global.json 钉 Uno.Sdk；
# 所以在仓库根直接 restore/build/test 整个解决方案即可。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Restore 要带 Configuration=Release：Uno.Sdk 按 Optimize 决定是否引用 DevServer 包，
    # 用 Debug 的还原结果去编译 Release 会命中 UNOB0019（DevServer 不允许优化构建）。
    - name: Restore
      run: dotnet restore Starward.slnx -p:Configuration=Release

    - name: Build
      run: dotnet build Starward.slnx -c Release --no-restore

    - name: Test (L1 单测)
      run: dotnet test Starward.slnx -c Release --no-build

    # L2：CLI 全链路冒烟（临时 XDG + 假运行器/假前缀/假外部命令，不需要显示器、不联网）
    - name: Install test deps
      run: sudo apt-get update && sudo apt-get install -y jq unzip

    - name: L2 CLI smoke
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: bash scripts/test/cli-smoke.sh

    - name: L1.5 UI self-test (xvfb)
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: |
        sudo apt-get install -y xvfb
        # 退出阶段 Uno/GTK 在 xvfb 上偶发 SIGSEGV（139），以自检自身的汇总行为准
        set +e
        xvfb-run -a -s "-screen 0 1280x800x24" "$LW_BIN" --selftest-ui 2>&1 | tee /tmp/selftest.log
        rc=${PIPESTATUS[0]}
        echo "selftest exit=$rc"
        grep -q "失败 0$" /tmp/selftest.log

    - name: Upload L2 artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: l2-logs
        path: /tmp/lw-l2-*/logs
        if-no-files-found: ignore
