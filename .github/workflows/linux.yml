name: Linux

# 只验证 Lunarward 能编译、纯逻辑单测能过。
# 不跑游戏、不下载游戏资源、不产出发行物（发布链路见 D38：推迟）。
#
# 仓库根的 Starward.slnx 只含 Linux 项目（D53），且有 global.json 钉 Uno.Sdk；
# 所以在仓库根直接 restore/build/test 整个解决方案即可。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Restore 要带 Configuration=Release：Uno.Sdk 按 Optimize 决定是否引用 DevServer 包，
    # 用 Debug 的还原结果去编译 Release 会命中 UNOB0019（DevServer 不允许优化构建）。
    - name: Restore
      run: dotnet restore Starward.slnx -p:Configuration=Release

    - name: Build
      run: dotnet build Starward.slnx -c Release --no-restore

    - name: Test (L1 单测)
      run: dotnet test Starward.slnx -c Release --no-build

    # 覆盖率：被测逻辑以链接源码方式编译在测试程序集内，必须带 tests/coverlet.runsettings
    # （IncludeTestAssembly=true），否则 coverlet 直接忽略测试程序集、覆盖率恒为 0。
    - name: Coverage (L1)
      env:
        LW_COVERAGE_OUT: ${{ runner.temp }}/coverage
      run: bash scripts/test/coverage.sh 85

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
        if-no-files-found: warn

    # L2：CLI 全链路冒烟（临时 XDG + 假运行器/假前缀/假外部命令，不需要显示器、不联网）
    - name: Install test deps
      run: sudo apt-get update && sudo apt-get install -y jq unzip zstd

    - name: L2 CLI smoke
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: bash scripts/test/cli-smoke.sh

    # L2 补充命令面：--shell-plan/--url-plan/--companion-*/--prefix-*/--runner-check/
    # --convert-screenshots + 假 Sophon 的 --install-plan/--patch-plan/--install-fetch/--update-run。
    - name: L2 CLI extra smoke
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: bash scripts/test/cli-extra.sh

    # L2 安装链路：本地假 Sophon 服务（protobuf 清单 + zstd 分块），验证「只下新块、未变更文件链接」。
    - name: L2 install smoke (fake Sophon)
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: bash scripts/test/chunk-smoke.sh

    # 性能冒烟：与 docs/linux-port/perf-baseline.json 比，超过 +20% 判回归（当前基线只含 CLI 冷启动）。
    - name: Perf smoke (baseline compare)
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: bash scripts/test/perf.sh

    - name: L1.5 UI self-test (xvfb)
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: |
        sudo apt-get install -y xvfb
        # 退出阶段 Uno/GTK 在 xvfb 上偶发 SIGSEGV（139），以自检自身的汇总行为准
        set +e
        xvfb-run -a -s "-screen 0 1280x800x24" "$LW_BIN" --selftest-ui 2>&1 | tee /tmp/selftest.log
        rc=${PIPESTATUS[0]}
        echo "selftest exit=$rc"
        grep -q "失败 0$" /tmp/selftest.log

    - name: Perf snapshot (informational)
      env:
        LW_BIN: ${{ github.workspace }}/src/Lunarward/bin/Release/net10.0-desktop/Lunarward
      run: |
        # CI 机器性能与本地基线不可比，这里只记录当次数值（不设门禁）；门禁在本地按 perf-baseline.json 比对
        bash scripts/test/perf.sh --record || true

    - name: Upload L2 artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: l2-logs
        path: /tmp/lw-l2-*/logs
        if-no-files-found: ignore
