name: Linux

# 只验证 Lunarward 能编译、纯逻辑单测能过。
# 不跑游戏、不下载游戏资源、不产出发行物（发布链路见 D38：推迟）。
#
# 注意：仓库根 global.json 钉的是上游 Windows 侧 SDK（10.0.400），本机/CI 都没有；
# 所有 dotnet 命令都在子目录里执行，命中 src/ 或 tests/ 下各自的 global.json。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/Lunarward/global.json

    # Restore 要带 Configuration=Release：Uno.Sdk 按 Optimize 决定是否引用 DevServer 包，
    # 用 Debug 的还原结果去编译 Release 会命中 UNOB0019（DevServer 不允许优化构建）。
    - name: Restore
      working-directory: src/Lunarward
      run: dotnet restore Lunarward.csproj -p:Configuration=Release

    - name: Build
      working-directory: src/Lunarward
      run: dotnet build Lunarward.csproj -c Release --no-restore

    - name: Test
      working-directory: tests/Lunarward.Tests
      run: dotnet test Lunarward.Tests.csproj -c Release
