name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-6 file zstd

      - name: Install appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool

      - name: Build AppDir + AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Lunarward-AppImage
          path: build/Lunarward-x86_64.AppImage
          if-no-files-found: error
